    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, system-ui, 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            height: 100%;
            width: 100%;
            background: #0d0d0d;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d0d;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .app-card {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            background: #0d0d0d;
            border-radius: 0;
            box-shadow: none;
            border: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
            padding: max(20px, env(safe-area-inset-top, 20px)) 
                     max(16px, env(safe-area-inset-right, 16px)) 
                     max(20px, env(safe-area-inset-bottom, 20px)) 
                     max(16px, env(safe-area-inset-left, 16px));
            -webkit-overflow-scrolling: touch;
        }

        @media (display-mode: standalone) {
            .app-card {
                padding: 20px;
                padding-top: max(20px, env(safe-area-inset-top, 20px));
                padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
            }
        }

        @supports (-webkit-touch-callout: none) {
            .app-card {
                padding-top: max(20px, env(safe-area-inset-top, 20px)) !important;
                padding-bottom: max(20px, env(safe-area-inset-bottom, 20px)) !important;
                padding-left: max(16px, env(safe-area-inset-left, 16px)) !important;
                padding-right: max(16px, env(safe-area-inset-right, 16px)) !important;
                height: 100%;
                min-height: 100%;
            }
        }

        .app-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f5c518;
            position: relative;
            width: 100%;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 4px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            width: 28px;
        }

        .header-left .logout-btn {
            background: transparent;
            border: none;
            color: #f5c518;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .header-left .logout-btn:active {
            transform: scale(0.85);
            color: #e0b010;
        }

        .header-left .logout-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #f5c518;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .portal-title {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #f5c518 0%, #f0b800 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            letter-spacing: -0.01em;
            text-shadow: 0 0 24px rgba(245, 197, 24, 0.08);
            flex: 1;
        }

        .burger-btn {
            width: 28px;
            height: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px 0;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
            margin-left: 8px;
            background: transparent;
            border: none;
        }

        .burger-btn .line {
            width: 100%;
            height: 3px;
            background: #f5c518;
            border-radius: 2px;
            transition: all 0.2s ease;
        }

        .burger-btn:active .line {
            background: #e0b010;
            transform: scale(0.9);
        }

        .location-wrapper {
            margin-top: 8px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .location-btn {
            background: transparent;
            border: 1px solid #3a3a3a;
            border-radius: 20px;
            padding: 6px 20px;
            color: #cccccc;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .location-btn:active {
            background: rgba(245, 197, 24, 0.1);
            border-color: #f5c518;
            transform: scale(0.95);
        }

        .location-btn .arrow {
            font-size: 10px;
            color: #888;
        }

        .divider-glow {
            width: 40px;
            height: 3px;
            background: #f5c518;
            border-radius: 4px;
            margin: 12px auto 0;
            opacity: 0.4;
        }

        .toast-notification {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: #1a1a1a;
            border: 1px solid #f5c518;
            border-radius: 16px;
            padding: 14px 24px;
            padding-top: max(14px, env(safe-area-inset-top, 14px));
            color: #f0f0f0;
            font-size: 15px;
            font-weight: 500;
            z-index: 3000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            max-width: 90%;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            margin-top: env(safe-area-inset-top, 0px);
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (display-mode: standalone) {
            .toast-notification {
                top: env(safe-area-inset-top, 0px);
                margin-top: 0;
                padding-top: max(14px, env(safe-area-inset-top, 14px));
            }
        }

        @supports (-webkit-touch-callout: none) {
            .toast-notification {
                top: env(safe-area-inset-top, 0px);
                padding-top: max(14px, env(safe-area-inset-top, 14px));
            }
        }

        .auth-section {
            transition: all 0.5s ease;
            overflow: hidden;
            max-height: 300px;
            opacity: 1;
            margin-bottom: 10px;
        }

        .auth-section.hidden {
            max-height: 0;
            opacity: 0;
            margin: 0;
            padding: 0;
            pointer-events: none;
        }

        .auth-form .form-group {
            margin-bottom: 14px;
        }

        .auth-form label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #cccccc;
            margin-bottom: 6px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid #2e2e2e;
            border-radius: 16px;
            color: #f0f0f0;
            font-size: 16px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .auth-form input:focus {
            border-color: #f5c518;
            box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.15);
        }

        .auth-form input::placeholder {
            color: #6a6a6a;
            font-weight: 300;
        }

        .auth-form .auth-error {
            color: #f44336;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
            display: none;
        }

        .auth-form .auth-error.active {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }

        .auth-btn-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 10px 0 20px;
            transition: all 0.5s ease;
            overflow: hidden;
            max-height: 80px;
            opacity: 1;
        }

        .auth-btn-wrapper.hidden {
            max-height: 0;
            opacity: 0;
            margin: 0;
            padding: 0;
            pointer-events: none;
        }

        .auth-btn {
            background: #f5c518;
            color: #0a0a0a;
            border: none;
            border-radius: 60px;
            padding: 18px 48px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(245, 197, 24, 0.3);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.02em;
            width: 100%;
            position: relative;
        }

        .auth-btn:active {
            transform: scale(0.96);
            background: #e0b010;
            transition-duration: 0.05s;
        }

        .auth-btn.loading {
            pointer-events: none;
            background: #4a4a4a;
            color: #888;
        }

        .auth-btn .btn-text {
            display: block;
        }

        .auth-btn.loading .btn-text {
            display: none;
        }

        .progress-bar-wrapper {
            display: none;
            width: 100%;
            margin-top: 6px;
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            height: 6px;
            border: 1px solid #2a2a2a;
        }

        .progress-bar-wrapper.active {
            display: block;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0a0a0a 0%, #f5c518 50%, #0a0a0a 100%);
            background-size: 200% 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
            animation: progressGradient 1.2s ease infinite;
        }

        .progress-bar-fill.animating {
            animation: progressFill 2.5s ease forwards, progressGradient 1.2s ease infinite;
        }

        .progress-bar-fill.doc-animating {
            animation: progressFill 3s ease forwards, progressGradient 1.2s ease infinite;
        }

        @keyframes progressFill {
            0% { width: 0%; }
            10% { width: 12%; }
            25% { width: 28%; }
            40% { width: 45%; }
            55% { width: 60%; }
            70% { width: 75%; }
            85% { width: 88%; }
            100% { width: 100%; }
        }

        @keyframes progressGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .main-content {
            display: none;
            animation: slideFade 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .main-content.active {
            display: block;
        }

        @keyframes slideFade {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .main-content.fade-out {
            animation: slideFadeOut 0.6s ease forwards;
        }

        @keyframes slideFadeOut {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-30px) scale(0.95);
                filter: blur(4px);
            }
        }

        .grid-buttons .btn-grid {
            opacity: 0;
            animation: fadeUp 0.4s ease forwards;
            transform: translateY(20px);
        }

        .grid-buttons .btn-grid:nth-child(1) { animation-delay: 0.05s; }
        .grid-buttons .btn-grid:nth-child(2) { animation-delay: 0.10s; }
        .grid-buttons .btn-grid:nth-child(3) { animation-delay: 0.15s; }
        .grid-buttons .btn-grid:nth-child(4) { animation-delay: 0.20s; }
        .grid-buttons .btn-grid:nth-child(5) { animation-delay: 0.25s; }
        .grid-buttons .btn-grid:nth-child(6) { animation-delay: 0.30s; }
        .grid-buttons .btn-grid:nth-child(7) { animation-delay: 0.35s; }
        .grid-buttons .btn-grid:nth-child(8) { animation-delay: 0.40s; }
        .grid-buttons .btn-grid:nth-child(9) { animation-delay: 0.45s; }
        .grid-buttons .btn-grid:nth-child(10) { animation-delay: 0.50s; }
        .grid-buttons .btn-grid:nth-child(11) { animation-delay: 0.55s; }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-area {
            opacity: 0;
            animation: fadeUp 0.4s ease 0.5s forwards;
            transform: translateY(20px);
        }

        .output-box {
            opacity: 0;
            animation: fadeUp 0.4s ease 0.55s forwards;
            transform: translateY(20px);
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .btn-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5c518;
            border: 1px solid #f5c518;
            border-radius: 20px;
            padding: 16px 6px;
            color: #0a0a0a;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        box-shadow 0.2s ease,
                        background 0.2s ease;
            box-shadow: 0 6px 16px rgba(245, 197, 24, 0.25);
            -webkit-tap-highlight-color: transparent;
            min-height: 76px;
            text-align: center;
            line-height: 1.3;
            letter-spacing: 0.01em;
            position: relative;
            transform: scale(1);
            touch-action: manipulation;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .btn-grid:active {
            transform: scale(0.88) !important;
            background: #e0b010;
            box-shadow: 0 2px 8px rgba(245, 197, 24, 0.3);
            transition-duration: 0.05s;
        }

        .btn-grid .label {
            font-size: 14px;
            font-weight: 600;
            color: #0a0a0a;
            letter-spacing: 0.02em;
            line-height: 1.3;
            pointer-events: none;
            user-select: none;
        }

        .btn-grid .label strong {
            font-weight: 700;
            color: #0a0a0a;
        }

        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.3s ease;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            padding: 20px;
        }

        .menu-overlay.active {
            display: flex;
        }

        @keyframes fadeInOverlay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .menu-popup {
            background: #1a1a1a;
            border-radius: 32px;
            padding: 32px 24px 28px;
            min-width: 280px;
            max-width: 90vw;
            width: 100%;
            max-width: 350px;
            border: 1px solid #f5c518;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8);
            animation: slideUpMenu 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            margin: auto;
            max-height: 70vh;
            overflow-y: auto;
        }

        @keyframes slideUpMenu {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .menu-popup .menu-title {
            color: #f5c518;
            font-size: 18px;

        // --- Функция для получения времени -1 час ---
        function getPastTime(hours = 1) {
            const now = new Date();
            now.setHours(now.getHours() - hours);
            const hoursStr = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return hoursStr + ':' + minutes;
        }

        // --- Функция для получения времени -72 минуты ---
        function getPastMinutes(minutes = 72) {
            const now = new Date();
            now.setMinutes(now.getMinutes() - minutes);
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            return hours + ':' + mins;
        }

        // --- Функция для получения времени +47 минут ---
        function getFutureTime(offsetMinutes = 47) {
            const now = new Date();
            now.setMinutes(now.getMinutes() + offsetMinutes);
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return hours + ':' + minutes;
        }

        // --- Функция для получения текущей даты и времени ---
        function getCurrentDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '.');
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            return { date: dateStr, time: timeStr };
        }

        // --- Инициализация Яндекс Карты ---
        function initYandexMap(lat, lng, pointName) {
            setTimeout(function() {
                const container = document.getElementById('yandexMapContainer');
                if (!container) return;
                
                if (typeof ymaps === 'undefined') {
                    container.innerHTML = '<div style="color:#888;text-align:center;padding:40px 20px;">⚠️ API Яндекс Карт не загрузился. Проверьте подключение.</div>';
                    return;
                }

                if (mapInstance) {
                    mapInstance.destroy();
                    mapInstance = null;
                }

                ymaps.ready(function() {
                    mapInstance = new ymaps.Map(container, {
                        center: [lat, lng],
                        zoom: 15,
                        controls: ['zoomControl', 'fullscreenControl']
                    });

                    var placemark = new ymaps.Placemark([lat, lng], {
                        balloonContent: '<b>' + pointName + '</b><br>' + lat.toFixed(6) + ', ' + lng.toFixed(6)
                    }, {
                        preset: 'islands#redDotIconWithCaption',
                        draggable: false
                    });
                    mapInstance.geoObjects.add(placemark);

                    setTimeout(function() {
                        if (mapInstance) {
                            mapInstance.container.fitToViewport();
                        }
                    }, 300);
                });
            }, 300);
        }

        // --- Тост ---
        function showToast(msg) {
            toastMessage.textContent = msg;
            toastNotification.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toastNotification.classList.remove('show'); toastTimer = null; }, 2000);
        }

        // --- Инфо-карточка ---
        function showInfo(title, contentHTML, actionConfig) {
            infoTitle.textContent = title;
            infoContent.innerHTML = contentHTML;
            infoActions.innerHTML = '';
            if (actionConfig) {
                const btn = document.createElement('button');
                btn.textContent = actionConfig.label || 'Выполнить';
                btn.className = actionConfig.className || 'btn-action-success';
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (actionConfig.onAction) actionConfig.onAction();
                    closeInfo();
                    if (navigator.vibrate) navigator.vibrate(10);
                });
                infoActions.appendChild(btn);
            }
            const btnClose = document.createElement('button');
            btnClose.textContent = 'Закрыть';
            btnClose.className = 'btn-close';
            if (!actionConfig) btnClose.style.flex = '1';
            btnClose.addEventListener('click', (e) => { e.stopPropagation(); closeInfo(); if (navigator.vibrate) navigator.vibrate(5); });
            infoActions.appendChild(btnClose);
            infoOverlay.classList.add('active');
            if (navigator.vibrate) navigator.vibrate(10);
        }
        function closeInfo() { 
            infoOverlay.classList.remove('active');
            if (mapInstance) {
                mapInstance.destroy();
                mapInstance = null;
            }
        }
        infoOverlay.addEventListener('click', (e) => { if (e.target === infoOverlay) closeInfo(); });

        // --- Полноэкранный просмотр фото ---
        function openFullscreen(imageSrc, label) {
            fullscreenImage.src = imageSrc;
            fullscreenInfo.textContent = label;
            photoFullscreen.classList.add('active');
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function closeFullscreenFn() {
            photoFullscreen.classList.remove('active');
            fullscreenImage.src = '';
        }

        closeFullscreen.addEventListener('click', closeFullscreenFn);
        photoFullscreen.addEventListener('click', function(e) {
            if (e.target === photoFullscreen) {
                closeFullscreenFn();
            }
        });

        // --- Функция для проверки существования изображения ---
        function imageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // --- Фотоотчёт: при нажатии на кнопку сразу открывается список рейсов ---
        function openPhotoReportMenu() {
            const html = `
                <div style="margin-bottom:12px;color:#888;font-size:13px;">Выберите рейс для просмотра фотографий</div>
                <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
                    ${Object.keys(photoData).map(ride => `
                        <button class="photo-ride-btn" data-ride="${ride}" style="background:#2a2a2a;border:1px solid #3a3a3a;border-radius:16px;padding:14px 10px;color:#f0f0f0;font-size:16px;font-weight:500;cursor:pointer;text-align:center;touch-action:manipulation;transition:all 0.2s ease;">
                            📸 ${ride}
                        </button>
                    `).join('')}
                </div>
            `;
            
            showInfo('📸 Фотоотчёт', html, null);
            showToast('📸 Выберите рейс');
            
            setTimeout(() => {
                document.querySelectorAll('.photo-ride-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const ride = this.dataset.ride;
                        openRidePhotos(ride);
                    });
                });
            }, 50);
        }

        // --- Открытие фотографий конкретного рейса с проверкой существования ---
        function openRidePhotos(ride) {
            const data = photoData[ride];
            if (!data) return;

            // Проверяем каждое фото и показываем либо изображение, либо заглушку
            const imagesHtml = data.images.map(img => {
                const imagePath = 'photo/' + img.file; // путь к папке photo (без "s")
                return `
                    <div class="photo-item" data-file="${imagePath}" data-label="${img.label}" data-filename="${img.file}">
                        <div class="photo-placeholder">🖼️</div>
                        <div class="photo-label">${img.label}</div>
                        <div class="photo-filename">${img.file}</div>
                        <div class="photo-overlay">Нажмите для просмотра</div>
                    </div>
                `;
            }).join('');

            const html = `
                <div style="margin-bottom:8px;color:#f5c518;font-weight:600;">📸 ${ride}</div>
                <div class="photo-grid">
                    ${imagesHtml}
                </div>
                <div style="color:#666;font-size:11px;text-align:center;margin-top:8px;">
                    Файлы: ${data.images.map(i => i.file).join(', ')}
                </div>
                <button class="menu-close" style="width:100%;padding:14px;margin-top:12px;background:transparent;border:1px solid #4a4a4a;border-radius:16px;color:#888;font-size:16px;cursor:pointer;touch-action:manipulation;" id="backToPhotoMenu">← Назад к рейсам</button>
            `;

            showInfo('📸 Фотоотчёт — ' + ride, html, null);

            // После отрисовки проверяем каждое фото и подгружаем его
            setTimeout(() => {
                document.querySelectorAll('.photo-item').forEach(item => {
                    const filePath = item.dataset.file;
                    const label = item.dataset.label;
                    const filename = item.dataset.filename;
                    
                    // Создаём img и проверяем загрузку
                    const img = new Image();
                    img.onload = function() {
                        // Фото загрузилось — показываем его
                        const existingImg = item.querySelector('img');
                        if (existingImg) {
                            existingImg.src = filePath;
                        } else {
                            const imgEl = document.createElement('img');
                            imgEl.src = filePath;
                            imgEl.alt = label;
                            item.insertBefore(imgEl, item.firstChild);
                        }
                        // Скрываем плейсхолдер
                        const placeholder = item.querySelector('.photo-placeholder');
                        if (placeholder) placeholder.style.display = 'none';
                        item.style.background = 'transparent';
                    };
                    img.onerror = function() {
                        // Фото не найдено — показываем заглушку
                        item.style.background = '#2a2a2a';
                        const placeholder = item.querySelector('.photo-placeholder');
                        if (placeholder) {
                            placeholder.textContent = '❌';
                            placeholder.style.fontSize = '32px';
                            placeholder.style.opacity = '1';
                        }
                        const labelEl = item.querySelector('.photo-label');
                        if (labelEl) {
                            labelEl.style.color = '#f44336';
                        }
                        const filenameEl = item.querySelector('.photo-filename');
                        if (filenameEl) {
                            filenameEl.textContent = 'файл не найден';
                            filenameEl.style.color = '#f44336';
                        }
                        showToast('⚠️ Файл не найден: ' + filename);
                    };
                    img.src = filePath;
                    
                    // Клик для открытия в полноэкранном режиме
                    item.addEventListener('click', function(e) {
                        const file = this.dataset.file;
                        const label = this.dataset.label;
                        // Проверяем, есть ли img с src
                        const imgEl = this.querySelector('img');
                        if (imgEl && imgEl.src && !imgEl.src.includes('error')) {
                            openFullscreen(file, label + ' (' + ride + ')');
                        } else {
                            showToast('⚠️ Фото не найдено: ' + this.dataset.filename);
                        }
                    });
                });
                
                // Кнопка "Назад"
                const backBtn = document.getElementById('backToPhotoMenu');
                if (backBtn) {
                    backBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        closeInfo();
                        setTimeout(() => openPhotoReportMenu(), 100);
                    });
                }
            }, 100);
        }

        // --- Выход ---
        logoutBtn.addEventListener('click', function() {
            mainContent.classList.add('fade-out');
            setTimeout(() => {
                isAuthorized = false;
                mainContent.classList.remove('active');

                passwordInput.value = '';

                passwordInput.disabled = false;
                document.querySelector('.auth-form').style.opacity = '1';

        // --- Авторизация ---
        authBtn.addEventListener('click', function() {
            const login = loginInput.value.trim();
            const password = passwordInput.value.trim();
            if (users[password] && login === password) {
                authError.classList.remove('active');
                progressWrapper.classList.add('active');
                progressFill.classList.add('animating');
                authBtn.querySelector('.btn-text').textContent = '⏳ Вход...';
                authBtn.style.background = '#4a4a4a';
                authBtn.style.color = '#888';
                authBtn.style.pointerEvents = 'none';
                currentUser = users[password];
                setTimeout(() => {
                    isAuthorized = true;
                    companyNameEl.textContent = currentUser.companyName;
                    companyInnEl.textContent = currentUser.inn;
                    authSection.classList.add('hidden');
                    authBtnWrapper.classList.add('hidden');
                    mainContent.classList.add('active');
                    showToast('✅ Авторизация выполнена');
                    if (navigator.vibrate) navigator.vibrate(20);
                    setTimeout(() => {
                        progressFill.classList.remove('animating');
                        progressFill.style.width = '0%';
                        progressWrapper.classList.remove('active');
                        authBtn.querySelector('.btn-text').textContent = '🔑 Авторизоваться';
                        authBtn.style.background = '#f5c518';
                        authBtn.style.color = '#0a0a0a';
                        authBtn.style.pointerEvents = 'auto';
                    }, 500);
                }, 2500);
            } else {
                authError.classList.add('active');
                if (navigator.vibrate) navigator.vibrate(30);
                setTimeout(() => { authError.classList.remove('active'); }, 3000);
            }
        });
        loginInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); passwordInput.focus(); } });
        passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); authBtn.click(); } });

        // --- Отправка документа ---
        async function sendDocument() {
            if (!isAuthorized) { showToast('⚠️ Авторизуйтесь сначала'); return; }
            const docName = messageInput.value.trim();
            if (!docName) { showToast('⚠️ Выберите документ'); return; }
            docProgressWrapper.classList.add('active');
            docProgressFill.classList.add('doc-animating');
            sendBtn.classList.add('loading');
            await new Promise(resolve => setTimeout(() => {
                sendBtn.classList.remove('loading');
                showToast('✅ Документ "' + docName + '" отправлен');
                messageInput.value = '';
                selectedDocument = '';
                if (navigator.vibrate) navigator.vibrate(6);
                resolve();

        // --- Меню для кнопок ---
        function openMenu(title, items, isSubmenu) {
            if (!isAuthorized) { showToast('⚠️ Авторизуйтесь сначала'); return; }
            menuTitle.textContent = title;
            menuItems.innerHTML = '';
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'menu-item' + (item.isSubmenu ? ' submenu-item' : '');
                btn.textContent = item.label || item;
                if (item.isSubmenu) {
                    btn.style.paddingLeft = '30px';
                    btn.style.fontSize = '14px';
                    btn.style.background = '#222';
                }
                btn.dataset.action = item.action || item;
                btn.dataset.submenu = item.submenu ? 'true' : 'false';
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const action = this.dataset.action;
                    const isSubmenu = this.dataset.submenu === 'true';
                    if (isSubmenu) {
                        const subItems = this.dataset.subItems ? JSON.parse(this.dataset.subItems) : [];
                        if (subItems.length) {
                            openMenu(action, subItems, true);
                        } else {
                            showToast('📋 ' + action);
                        }
                    } else {
                        handleMenuItemClick(title, action);
                        closeMenu();
                    }
                    if (navigator.vibrate) navigator.vibrate(8);
                });
                if (item.subItems) {
                    btn.dataset.subItems = JSON.stringify(item.subItems);
                    btn.dataset.submenu = 'true';
                }
                menuItems.appendChild(btn);
            });
            menuOverlay.classList.add('active');
        }
        function closeMenu() { menuOverlay.classList.remove('active'); }
        menuClose.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', (e) => { if (e.target === menuOverlay) closeMenu(); });

                'Отчёт по объёму': {

                    info: (btn) => `<div class="data-row"><span>Операция</span><span class="highlight">Список нарушений</span></div>

                },
                'Оплатить штраф': {

                },
                'Акт проверки': {

                        <div class="data-row"><span>Результат</span><span style="color: #4CAF50;">нарушений не выявлено</span></div>
                        <div class="data-row"><span>Проверяющий</span><span>Инспектор Петров С.В.</span></div>
                        <div class="data-row"><span>Статус</span><span style="color: #4CAF50;">● акт подписан</span></div>`
                },
                'Статистика нарушений': {
                    info: (btn) => `<div class="data-row"><span>Операция</span><span class="highlight">Статистика нарушений</span></div>
                        <div class="data-row"><span>Период</span><span class="highlight">2026 год</span></div>
                        <div class="data-row"><span>Всего нарушений</span><span class="highlight">11</span></div>
                        <div class="data-row"><span>На сумму</span><span class="highlight">165 000 ₽</span></div>
                        <div class="data-row"><span>Оплачено</span><span>135 000 ₽</span></div>
                        <div class="data-row"><span>Остаток</span><span style="color: #f44336;">30 000 ₽</span></div>
                        <div class="data-row"><span>Статистика по ГРЗ</span><span style="color: #f5c518;">→ доступна</span></div>`
                },
                'Статистика по ГРЗ': {
                    info: (btn) => `<div class="data-row"><span>Операция</span><span class="highlight">Статистика по ГРЗ</span></div>
                        <div class="data-row"><span>А123ВС 78</span><span>3 нарушения, 45 000 ₽</span></div>
                        <div class="data-row"><span>В456МР 78</span><span>1 нарушение, 15 000 ₽</span></div>
                        <div class="data-row"><span>С789ТХ 78</span><span>2 нарушения, 30 000 ₽</span></div>
                        <div class="data-row"><span>Е012ОК 78</span><span>0 нарушений, 0 ₽</span></div>
                        <div class="data-row"><span>К345АА 78</span><span>5 нарушений, 75 000 ₽</span></div>
                        <div class="data-row"><span>Итого</span><span style="color: #f5c518;">11 нарушений, 165 000 ₽</span></div>`
                },
                // История маршрутов
                'Все маршруты': {
                    info: (btn) => {
                        const times = ['11:12', '11:48', '12:22', '12:58', '13:47'];
                        let html = `<div class="data-row"><span>Операция</span><span class="highlight">Последние 5 маршрутов</span></div>`;
                        times.forEach((t, i) => {
                            html += `<div class="data-row"><span>Рейс ${i+1}</span><span>${todayStr} ${t}</span></div>`;
                        });
                        html += `<div class="data-row"><span>Всего рейсов</span><span class="highlight">120</span></div>
                                <div class="data-row"><span>Выполнено</span><span style="color: #4CAF50;">118</span></div>
                                <div class="data-row"><span>Следующий вывоз</span><span>${todayStr} ${futureTime}</span></div>`;
                        return html;
                    }
                },
                'Отчёт по маршрутам': {
                    info: (btn) => `<div class="data-row"><span>Операция</span><span class="highlight">Отчёт по маршрутам</span></div>
                        <div class="data-row"><span>Период</span><span class="highlight">${todayStr}</span></div>
                        <div class="data-row"><span>Всего маршрутов</span><span class="highlight">120</span></div>
                        <div class="data-row"><span>Общая протяжённость</span><span class="highlight">3 960 км</span></div>
                        <div class="data-row"><span>Средняя длина</span><span>33 км</span></div>
                        <div class="data-row"><span>Эффективность</span><span style="color: #4CAF50;">98%</span></div>`
                },
                'График вывоза': {
                    info: (btn) => `<div class="data-row"><span>Операция</span><span class="highlight">График вывоза</span></div>
                        <div class="data-row"><span>Период</span><span class="highlight">Август 2026</span></div>
                        <div class="data-row"><span>Всего рейсов</span><span class="highlight">120</span></div>
                        <div class="data-row"><span>Выполнено</span><span style="color: #4CAF50;">118</span></div>
                        <div class="data-row"><span>Запланировано</span><span>2</span></div>
                        <div class="data-row"><span>Следующий вывоз</span><span>${todayStr} ${futureTime}</span></div>`
                }
            };

            // Формируем уникальный ключ для каждой точки
            let uniqueKey = action;
            if (buttonTitle.includes('Точка 1')) {
                uniqueKey = 'Точка 1: ' + action;
            } else if (buttonTitle.includes('Точка 2')) {
                uniqueKey = 'Точка 2: ' + action;
            } else if (buttonTitle.includes('Точка 3')) {
                uniqueKey = 'Точка 3: ' + action;
            }

            // Обработка "Объект на карте"
            if (action === 'Объект на карте') {
                let pointNum = '1';
                if (buttonTitle.includes('Точка 2')) pointNum = '2';
                else if (buttonTitle.includes('Точка 3')) pointNum = '3';
                else if (buttonTitle.includes('Точка 1')) pointNum = '1';
                const coords = pointCoords[pointNum];
                
                const infoHTML = `<div class="data-row"><span>Точка</span><span class="highlight">${buttonTitle}</span></div>
                    <div class="yandex-map-container" id="yandexMapContainer"></div>
                    <div class="map-coords">📍 <span>${coords.lat.toFixed(6)}</span>, <span>${coords.lng.toFixed(6)}</span></div>
                    <div style="text-align:center;color:#666;font-size:12px;margin-top:4px;">Координаты: ${coords.lat.toFixed(6)}, ${coords.lng.toFixed(6)}</div>`;
                
                showInfo(buttonTitle, infoHTML, null);
                showToast('🗺️ ' + buttonTitle + ' → Объект на карте');
                
                setTimeout(function() {
                    initYandexMap(coords.lat, coords.lng, pointCoords[pointNum].name);
                }, 400);
                return;
            }

            const data = actionData[uniqueKey];
            let infoHTML = '';
            let title = buttonTitle;

            if (data) {
                infoHTML = data.info(buttonTitle);
            } else {
                infoHTML = `<div class="data-row"><span>Операция</span><span class="highlight">${buttonTitle}</span></div>
                    <div class="data-row"><span>Действие</span><span>${action}</span></div>
                    <div class="data-row"><span>Статус</span><span style="color: #4CAF50;">● выполнено</span></div>
                    <div class="data-row"><span>Время</span><span>${new Date().toLocaleTimeString('ru-RU')}</span></div>`;
            }

            const actionTypes = ['Начать загрузку', 'Отправить на переработку', 'Оплатить штраф', 'Построить маршрут', 'Оптимизировать', 'Сканировать зону', 'Калибровка весов', 'Выполнить'];
            let actionConfig = null;
            if (actionTypes.includes(action)) {
                actionConfig = {
                    label: '✅ Выполнить',
                    className: 'btn-action-success',
                    onAction: function() {
                        showToast('✅ ' + action + ' выполнено повторно');
                        if (navigator.vibrate) navigator.vibrate(15);
                    }
                };
            }

            showToast('📋 ' + buttonTitle + ' → ' + action);
            showInfo(title, infoHTML, actionConfig);

            // Обработка загрузки файлов для "Акт(ы) об утилизации"
            if (action === 'Акт(ы) об утилизации') {
                setTimeout(() => {
                    const uploadArea = document.getElementById('uploadArea');
                    const fileInput = document.getElementById('fileInput');
                    const uploadedFiles = document.getElementById('uploadedFiles');
                    const sendActBtn = document.getElementById('sendActBtn');
                    
                    if (uploadArea && fileInput) {
                        uploadArea.addEventListener('click', () => fileInput.click());
                        fileInput.addEventListener('change', function(e) {
                            const files = e.target.files;
                            let html = '<div style="color:#4CAF50;font-size:13px;">📎 Загружено файлов: ' + files.length + '</div>';
                            for (let i = 0; i < files.length; i++) {
                                html += `<div style="color:#aaa;font-size:12px;padding:2px 0;">• ${files[i].name} (${(files[i].size/1024).toFixed(0)} КБ)</div>`;
                            }
                            uploadedFiles.innerHTML = html;
                            showToast('✅ Загружено ' + files.length + ' файлов');
                        });
                    }
                    
                    if (sendActBtn) {
                        sendActBtn.addEventListener('click', function() {
                            const files = fileInput.files;
                            if (files.length === 0) {
                                showToast('⚠️ Сначала загрузите документы');
                                return;
                            }
                            sendActBtn.classList.add('loading');
                            setTimeout(() => {
                                sendActBtn.classList.remove('loading');
                                showToast('✅ Акты об утилизации отправлены (' + files.length + ' файлов)');
                                if (navigator.vibrate) navigator.vibrate(15);
                            }, 2500);
                        });
                    }
                }, 100);
            }
        }

        // --- Обработчики для кнопок сетки ---
        gridButtons.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (!isAuthorized) { showToast('⚠️ Авторизуйтесь сначала'); return; }
                const point = this.dataset.point;
                const action = this.dataset.action;
                const type = this.dataset.type;
                let title = '', items = [];
                if (type === 'point' || point) {
                    const pointName = point === '1' ? 'Точка 1 (Объект образования отходов)' :
                                    point === '2' ? 'Точка 2 (Объект утилизации отходов)' :
                                    point === '3' ? 'Точка 3 (Покупатель)' :
                                    'Точка ' + point;
                    title = pointName;
                    items = [
                        'Показать отходы на точке',
                        'История отходов',
                        'Отправить на переработку',
                        'План вывоза'
                    ];
                    if (point === '2') {
                        items.push('Акт(ы) об утилизации');
                    }
                    items.push('Объект на карте');
                } else if (type === 'fine') {
                    title = 'Штрафы';
                    items = [
                        'Список нарушений',
                        'Оплатить штраф',
                        'Акт проверки',
                        'Статистика нарушений',
                        'Статистика по ГРЗ'
                    ];
                } else if (type === 'photo') {
                    title = 'Фотоотчёт';
                    // При клике на кнопку Фотоотчёт сразу открываем меню рейсов
                    openPhotoReportMenu();
                    return;
                } else if (type === 'history') {
                    title = 'История маршрутов';
                    items = ['Все маршруты', 'Отчёт по маршрутам', 'График вывоза'];
                } else if (type === 'gisedp') {
                    title = 'ГИС ЭПД';
                    items = ['Отправить', 'История'];
                } else if (type === 'action') {
                    switch (action) {
                        case 'Загрузка': title = 'Загрузка'; items = ['Начать загрузку', 'Журнал загрузок', 'Контроль веса', 'Отчёт по загрузке']; break;
                        case 'Весы': title = 'Весы'; items = ['Текущий вес', 'История взвешиваний', 'Отчёт по весам', 'Калибровка весов']; break;
                        case 'Маршрут': title = 'Маршрут'; items = ['Построить маршрут', 'Оптимизировать']; break;
                        case 'Лидар': title = 'Лидар'; items = ['Сканировать зону', 'История сканирований', 'Отчёт по объёму']; break;
                        default: title = action || 'Действие'; items = ['Выполнить', 'История', 'Отчёт'];
                    }
                } else { title = 'Меню'; items = ['Действие 1', 'Действие 2']; }
                if (navigator.vibrate) navigator.vibrate(15);
                openMenu(title, items);
            });
        });

        // --- Загрузка ---
        window.addEventListener('load', function() {
            loginInput.focus();
        });

        // --- Escape ---
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (photoFullscreen.classList.contains('active')) {
                    closeFullscreenFn();
                } else if (infoOverlay.classList.contains('active')) {
                    closeInfo();
                } else if (docMenuOverlay.classList.contains('active')) {
                    closeDocMenu();
                } else if (menuOverlay.classList.contains('active')) {
                    closeMenu();
                } else if (locationMenuOverlay.classList.contains('active')) {
                    closeLocationMenu();
                } else if (profileMenuOverlay.classList.contains('active')) {
                    closeProfileMenu();
                }
            }
        });

    })();
</script>
